<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LV4 - Zadatak 4 - Stablo predmeta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stablo predmeta</h1>

    <div class="cvor">
        <span class="naslov-cvora" id="naslov-prva">
            <span class="znak">+</span> Prva godina
        </span>
        <div class="podstablo" id="podstablo-prva">
            <div>- IM1</div>
            <div>- IM2</div>
            <div>- OE</div>
            <div>- EES</div>
            <div>- IF1</div>
            <div>- LAG</div>
            <div>- UUR</div>
            <div>- TP</div>
        </div>
    </div>

    <div class="cvor">
        <span class="naslov-cvora" id="naslov-druga">
            <span class="znak">+</span> Druga godina
        </span>
        <div class="podstablo" id="podstablo-druga">
            <div>- ASP</div>
            <div>- DM</div>
            <div>- LD</div>
            <div>- RPR</div>
            <div>- SP</div>
            <div>- OS</div>
            <div>- VIS</div>
            <div>- NA</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
